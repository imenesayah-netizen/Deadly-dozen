// next session = earliest incomplete required day (skips rest + optional)
function firstIncomplete(){
  for(let w=1;w<=NWEEKS;w++){ const days=getDays(w);
    for(let i=0;i<days.length;i++){ const d=days[i]; if(!d.rest&&!d.optional&&!((DATA[`w${w}d${i}`]||{}).completed)&&!((DATA[`w${w}d${i}`]||{}).skipped)) return {w,i}; } }
  return null;
}
function nextAfter(cw,ci){
  const order=[]; for(let w=1;w<=NWEEKS;w++) for(let i=0;i<7;i++) order.push([w,i]);
  const start=order.findIndex(o=>o[0]===cw&&o[1]===ci)+1;
  for(let k=0;k<order.length;k++){ const [w,i]=order[(start+k)%order.length]; const d=getDays(w)[i];
    if(!d.rest&&!d.optional&&!((DATA[`w${w}d${i}`]||{}).completed)&&!((DATA[`w${w}d${i}`]||{}).skipped)) return {w,i}; }
  return null;
}

// swap indoor-only work (equipment circuits, floor core, burpees) for run-based alternatives
function outdoorize(secs){
  const badRx=/hollow|plank|dead ?bug|hanging|burpee|sit-?up|crunch|v-?up|bear ?crawl/i;
  const kitRx=/wall ball|kb|kettlebell|ski|\brow\b|sled|burpee/i;
  return secs.map((sec,si)=>{
    if(sec.fin){
      const txt=(sec.lbl+" "+sec.cs.map(c=>c.n).join(" "));
      if(kitRx.test(txt)) return {lbl:"Outdoor swap — race-pace surges",exs:[
        {id:"out"+si+"a",ic:"💨",n:"Race-pace surges",s:"5×30s",note:"Easy jog 60s between · same 'lift on tired legs' skill, no kit"}]};
      return sec;
    }
    if((sec.exs||[]).some(x=>badRx.test(x.n))){
      // keep the non-floor exercises, replace the floor/burpee ones with standing work
      const kept=sec.exs.filter(x=>!badRx.test(x.n));
      kept.push({id:"out"+si+"c",ic:"🦵",n:"Walking lunges",s:"2×20",note:"Standing — replaces floor core"});
      kept.push({id:"out"+si+"d",ic:"🦵",n:"Calf raises (curb)",s:"3×15",note:"Standing"});
      return {lbl:sec.lbl+" · outdoor",exs:kept};
    }
    return sec;
  });
}

// ── Train ──
function train(){
  const days=getDays(S.week),note=wNote(S.week),ph=PHASES[phOf(S.week)-1],curPhase=phOf(S.week),cur=days[S.day];
  const blocks=PHASES.map(p=>({id:p.id,name:p.title,wks:p.wks,weeks:Object.keys(p.weeks).map(Number)}));
  // block cards
  let h=`<div style="display:flex;gap:7px;margin-bottom:12px">`;
  blocks.forEach(b=>{ const on=curPhase===b.id; let done=0,total=0;
    b.weeks.forEach(w=>getDays(w).forEach((d,i)=>{ if(!d.rest){total++; if((DATA[`w${w}d${i}`]||{}).completed)done++;} }));
    const pct=total?Math.round(done/total*100):0;
    h+=`<div data-act="phase" data-v="${b.id}" style="flex:1;background:${C.card};border:1px solid ${on?C.lime:C.border};border-radius:14px;padding:11px 9px 10px;cursor:pointer;${on?`box-shadow:0 0 14px rgba(255,90,54,.13)`:""}">
      <div style="font-family:${F.mono};font-size:8px;color:${C.muted};letter-spacing:.14em">PHASE ${b.id}</div>
      <div style="font-family:${F.disp};font-size:20px;letter-spacing:.01em;color:${on?C.lime:C.text};line-height:1.02;margin:2px 0 3px">${b.name}</div>
      <div style="font-family:${F.mono};font-size:9px;color:${on?C.lime:C.muted}">${b.wks}</div>
      <div style="margin-top:8px">${bar(pct,on?C.lime:C.muted)}</div>
    </div>`; });
  h+=`</div>`;
  // week row — current phase only
  h+=`<div style="display:flex;gap:5px;background:${C.surface};border:1px solid ${C.border};border-radius:12px;padding:5px;margin-bottom:12px">`;
  blocks[curPhase-1].weeks.forEach(w=>{ const on=w===S.week,wc=weekComplete(w);
    h+=`<div data-act="week" data-v="${w}" style="flex:1;text-align:center;padding:11px 4px;border-radius:9px;background:${on?C.lime:"transparent"};color:${on?"#140f0d":C.muted};font-family:${F.mono};font-size:13px;font-weight:700;cursor:pointer;position:relative">Wk${w}${wc&&!on?`<span style="position:absolute;top:6px;right:9px;width:5px;height:5px;border-radius:50%;background:${C.green}"></span>`:""}</div>`; });
  h+=`</div>
  <div style="background:rgba(255,181,71,.05);border:1px solid rgba(255,181,71,.2);border-radius:11px;padding:11px 13px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px">
      <span style="font-family:${F.disp};font-size:17px;color:${C.text};letter-spacing:.04em">${e(note.h)}</span>
      <span style="font-family:${F.mono};font-size:9px;color:${C.blue};white-space:nowrap">${e(note.rpe)}</span></div>
    <div style="font-family:${F.mono};font-size:11px;color:${C.blue};margin-bottom:3px">${TAGEMO[cur.tag]||"•"} ${e(cur.name)}${cur.dur?" · "+e(cur.dur):""}${cur.tag==="cond"&&!cur.rest?" · "+e(note.run.split(" · ")[0]):""}</div>
    <div style="font-family:${F.mono};font-size:9px;color:${C.muted}">${e(fmtDate(sessionDate(S.week,S.day)))} · ${relDay(sessionDate(S.week,S.day))} · rest ${e(note.rest)} · 🏁 ${dtr()}d</div>
  </div>`;
  h+=`<div style="display:flex;gap:5px;margin-bottom:16px;flex-wrap:wrap">`;
  days.forEach((d,i)=>{ const dk=`w${S.week}d${i}`,done=(DATA[dk]||{}).completed,sk=!done&&(DATA[dk]||{}).skipped,on=i===S.day;
    h+=`<div data-act="day" data-v="${i}" style="flex:1 1 0;min-width:38px;padding:9px 2px;border-radius:9px;border:1px solid ${on?d.c:C.border};background:${on?d.c:done?"rgba(74,222,128,.1)":"transparent"};color:${on?"#140f0d":done?C.green:C.muted};cursor:pointer;font-family:${F.mono};font-weight:700;font-size:12px;text-align:center;position:relative;${sk&&!on?"border-style:dashed;opacity:.55;text-decoration:line-through":""}">${e(d.num)}${done&&!on?`<span style="position:absolute;top:2px;right:4px;font-size:8px">✓</span>`:""}</div>`; });
  h+=`</div>`+dayCard(cur,`w${S.week}d${S.day}`);
  return h;
}

// ── Fuel ──
function fuel(){
  const tabs=[["daily","Sessions"],["morning","Early AM"],["race","Race Wk"],["enough","Enough?"]];
  if(!tabs.some(t=>t[0]===S.fuel)) S.fuel="daily";
  const SH=(x,c)=>`<div style="font-family:${F.disp};font-size:19px;color:${c||C.lime};letter-spacing:.03em;margin:16px 0 8px">${x}</div>`;
  const row=(k,v,c)=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:9px 12px;background:${C.card};border-radius:8px;margin-bottom:5px;align-items:flex-start"><span style="font-family:${F.mono};font-size:11px;color:${c||C.muted};font-weight:600;white-space:nowrap">${e(k)}</span><span style="font-size:11.5px;color:${C.muted};line-height:1.5;text-align:right">${v}</span></div>`;
  let h=`<div class="fade"><div style="font-family:${F.disp};font-size:30px;letter-spacing:.03em;color:${C.text}">FUEL <span style="color:${C.blue}">GUIDE</span></div>
    <div style="font-family:${F.mono};font-size:10px;color:${C.muted};margin-bottom:12px">Same as your HYROX block · eat to the work, follow hunger</div>
    <div style="display:flex;gap:2px;background:${C.surface};border:1px solid ${C.border};border-radius:10px;padding:3px;margin-bottom:6px">`;
  tabs.forEach(([id,l])=>{ const on=S.fuel===id;
    h+=`<div data-act="fuel" data-v="${id}" style="flex:1;padding:8px 4px;border-radius:8px;background:${on?C.lime:"transparent"};color:${on?"#140f0d":C.muted};font-family:${F.mono};font-size:9.5px;letter-spacing:.04em;font-weight:${on?700:400};cursor:pointer;white-space:nowrap;text-align:center">${l}</div>`; });
  h+=`</div>`;
  if(S.fuel==="daily"){
    h+=`<div style="background:rgba(255,181,71,.06);border:1px solid rgba(255,181,71,.2);border-radius:10px;padding:11px 12px;margin-top:12px;font-size:12px;color:${C.muted};line-height:1.6">Nothing changes from what's been working. Protein at every meal, carbs around training, more on the big days. <b style="color:${C.text}">If you're hungry, eat</b> — hunger in a hard week is your body asking for fuel.</div>`;
    h+=SH("By session");
    [["D3 circuit / rehearsal","Biggest carb day — carb-rich dinner the night before, proper meal after"],["D1 / D2 / D4","Carbs before and after · protein after"],["D5 / D6","Normal meals"],["Rest","Normal meals — recovery is training"]].forEach(([k,v])=>h+=row(k,v,C.blue));
    h+=SH("Plate shape");
    [["Every meal","Protein + carbs + veg"],["After training","Carbs + protein within ~1–2h"],["Hydration","Water through the day · electrolytes on sweaty sessions"]].forEach(([k,v])=>h+=row(k,v,C.lime));
  } else if(S.fuel==="morning"){
    h+=SH("Early sessions");
    [["Easy / short","Rice cakes + honey is fine"],["Hard (D1, D3, D4)","Add a banana or dates · juice if solids are hard at 5am"],["The real lever","The carb-rich dinner the night before"],["Straight after","Proper breakfast — carbs + protein"]].forEach(([k,v])=>h+=row(k,v,C.lime));
  } else if(S.fuel==="race"){
    h+=SH("Race week");
    [["Mon–Wed","Normal eating · hydrate · nothing new"],["Thu–Fri","Carbs at every meal · familiar foods · go easy on fibre Friday"],["Scale up?","Expected — carbs hold water. It's fuel, not fat."],["Race morning","Breakfast 2.5–3h before · same as rehearsal · caffeine ~45 min out"],["After","Eat well and celebrate"]].forEach(([k,v])=>h+=row(k,v,C.lime));
  } else {
    h+=SH("Are you eating enough?",C.orange);
    h+=`<div style="background:rgba(255,138,61,.06);border:1px solid rgba(255,138,61,.25);border-radius:10px;padding:12px 13px;font-size:12.5px;color:${C.muted};line-height:1.7">If two or more creep in, <b style="color:${C.text}">eat more — mostly carbs</b>, don't train harder:<div style="margin-top:8px">`;
    ["WHOOP HRV down / RHR up over several days","Runs or circuits stalling at the same effort","Broken sleep despite fatigue","Always cold","Niggles that won't clear","Low mood or short fuse","Any change to your cycle"].forEach(x=>h+=`<div style="display:flex;gap:8px;padding:3px 0"><span style="color:${C.orange}">›</span><span>${x}</span></div>`);
    h+=`</div><div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)">Food feeling noisy? A sports dietitian can set this up with you properly — worth it.</div></div>`;
  }
  return h+`</div>`;
}

// ── Body ──
function body(){
  const saved=DATA.__body||BODY_SEED;
  const entries=(saved.entries||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const base=entries[0],latest=entries.length>1?entries[entries.length-1]:null,show=latest||base;
  const del=(k,inv)=>{ if(!latest||!base)return null; const d=parseFloat(latest[k])-parseFloat(base[k]); if(isNaN(d))return null; return {d,good:inv?d<0:d>0}; };
  const mets=[["weight","Weight","kg",false,true],["smm","Muscle","kg",false,false],["pbf","Body Fat","%",true,false],["bmr","BMR","kcal",false,false],["vfa","Visceral","cm²",true,false],["score","Score","",false,false]];
  let h=`<div class="fade"><div style="font-family:${F.disp};font-size:30px;letter-spacing:.03em;color:${C.text}">BODY <span style="color:${C.purple}">TRACKER</span></div>
    <div style="font-family:${F.mono};font-size:10px;color:${C.muted};margin-bottom:14px">Baseline: InBody ${base?base.date:"—"} · hold, don't cut</div>
    <div style="font-family:${F.mono};font-size:9px;color:${C.muted};letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px">${latest?"Latest vs Baseline":"Baseline · "+(base?base.date:"")}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px">`;
  mets.forEach(([k,l,u,inv,neu])=>{ const d=del(k,inv),v=show?show[k]:null;
    h+=`<div style="background:${C.card};border:1px solid ${C.border};border-radius:10px;padding:10px"><div style="font-family:${F.mono};font-size:8px;color:${C.muted};text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">${l}</div><div style="font-family:${F.disp};font-size:22px;color:${C.purple};line-height:1">${v||"—"}</div><div style="font-family:${F.mono};font-size:8px;color:${C.muted}">${u}</div>${d?`<div style="font-family:${F.mono};font-size:9px;font-weight:600;margin-top:3px;color:${neu?C.orange:d.good?C.green:C.red}">${d.d>0?"+":""}${d.d.toFixed(1)}${u}</div>`:""}</div>`; });
  h+=`</div>
    <div style="background:rgba(255,143,163,.06);border:1px solid rgba(255,143,163,.2);border-radius:10px;padding:11px 12px;margin-bottom:16px;font-size:11.5px;color:${C.muted};line-height:1.6">🎯 <b style="color:${C.text}">Goal this block: hold, don't cut.</b> Short sharpening block — muscle and body fat should simply hold. Scale moves with your cycle and carbs; that's water, not fat.</div>
    <div style="font-family:${F.mono};font-size:9px;color:${C.muted};letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px">Scan cadence</div>`;
  [["#4ade80","13 Oct — latest scan (pre-block)"],["#ff8fa3","No scan during the block"],["#ff5a36","Post-race · early Dec, fasted, same point in cycle"]].forEach(([c,l])=>{
    h+=`<div style="display:flex;gap:8px;align-items:center;padding:5px 0"><div style="width:3px;align-self:stretch;background:${c};border-radius:2px;min-height:14px"></div><div style="font-size:12px;color:${C.text}">${l}</div></div>`; });
  if(entries.length){ h+=`<div style="font-family:${F.mono};font-size:9px;color:${C.muted};letter-spacing:.12em;text-transform:uppercase;margin:16px 0 6px">History</div>`;
    entries.forEach((en,i)=>{ h+=`<div style="background:${C.card};border:1px solid ${C.border};border-radius:9px;padding:9px 12px;margin-bottom:5px"><div style="font-family:${F.mono};font-size:9px;color:${C.purple};margin-bottom:3px">${i===0?"BASELINE · ":""}${en.date}</div><div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:${C.text}">${en.weight?`<span>⚖ ${en.weight}kg</span>`:""}${en.smm?`<span>💪 ${en.smm} SMM</span>`:""}${en.pbf?`<span>📊 ${en.pbf}%</span>`:""}${en.score?`<span>🔥 ${en.score}</span>`:""}</div></div>`; }); }
  h+=`<div style="margin-top:16px;background:${C.surface};border:1px solid rgba(255,143,163,.3);border-radius:11px;padding:14px">
    <div style="font-family:${F.mono};font-size:9px;color:${C.purple};letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px">Log New InBody</div>
    <input data-bf="date" type="date" value="${new Date().toISOString().split("T")[0]}" style="width:100%;background:${C.card};border:1px solid ${C.border};border-radius:7px;padding:8px 10px;color:${C.text};font-size:12px;outline:none;margin-bottom:8px;box-sizing:border-box"/>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">`;
  [["weight","Weight kg"],["smm","SMM kg"],["pbf","Body Fat %"],["bmr","BMR"],["vfa","VFA cm²"],["score","Score"]].forEach(([k,l])=>{
    h+=`<input data-bf="${k}" type="number" inputmode="decimal" placeholder="${l}" style="width:100%;background:${C.card};border:1px solid ${C.border};border-radius:7px;padding:8px;color:${C.text};font-size:13px;outline:none;text-align:center;box-sizing:border-box"/>`; });
  h+=`</div><button data-act="bodysave" style="width:100%;padding:13px;border-radius:10px;border:1px solid ${C.purple};background:${C.purple};color:#140f0d;font-family:${F.disp};font-size:15px;letter-spacing:.06em;cursor:pointer">SAVE ENTRY</button></div></div>`;
  return h;
}

// ── Progress ──
function progress(){
  let done=0;const total=TOTAL;
  let rows="";
  for(let w=1;w<=NWEEKS;w++){ const days=getDays(w);
    let cells="";
    days.forEach((d,di)=>{ const c=(DATA[`w${w}d${di}`]||{}).completed, sk=!c&&(DATA[`w${w}d${di}`]||{}).skipped; if(c)done++;
      cells+=`<div data-act="jump" data-w="${w}" data-d="${di}" style="flex:1;height:30px;border-radius:6px;border:1px ${sk?"dashed":"solid"} ${c?C.green:C.border};background:${c?"rgba(74,222,128,.18)":d.rest?"rgba(255,255,255,.02)":"transparent"};color:${c?C.green:C.muted};display:flex;align-items:center;justify-content:center;font-family:${F.mono};font-size:9px;font-weight:600;cursor:pointer;${sk?"opacity:.5":""}">${c?"✓":sk?"–":e(d.num)}</div>`; });
    rows+=`<div style="margin-bottom:8px"><div style="font-family:${F.mono};font-size:9px;color:${phOf(w)===3?C.lime:C.muted};margin-bottom:4px;letter-spacing:.08em">WEEK ${w} · ${PHASES[phOf(w)-1].title}</div><div style="display:flex;gap:4px">${cells}</div></div>`; }
  const pct=Math.round(done/total*100);
  return `<div class="fade"><div style="font-family:${F.disp};font-size:30px;letter-spacing:.03em;color:${C.text}">PROGRESS</div>
    <div style="font-family:${F.mono};font-size:10px;color:${C.muted};margin-bottom:14px">${done} of ${total} sessions · 🏁 ${dtr()} days to race</div>
    <div style="background:${C.card};border:1px solid ${C.border};border-radius:11px;padding:14px;margin-bottom:16px;text-align:center"><div style="font-family:${F.disp};font-size:44px;color:${C.lime};line-height:1">${pct}%</div><div style="margin:8px 0">${bar(pct,C.lime)}</div><div style="font-family:${F.mono};font-size:10px;color:${C.muted}">programme complete</div></div>${rows}
    <div style="background:${C.surface};border:1px solid rgba(255,181,71,.25);border-radius:12px;padding:14px;margin-top:18px">
      <div style="font-family:${F.mono};font-size:9px;color:${C.blue};letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px">Backup & Restore</div>
      <div style="font-size:11.5px;color:${C.muted};line-height:1.55;margin-bottom:11px">Your logs live only on this device. Export a copy before any update or phone change — then Import to bring it back.</div>
      <div style="display:flex;gap:8px">
        <button data-act="export" style="flex:1;padding:11px;border-radius:9px;border:1px solid ${C.blue};background:${C.blue};color:#140f0d;font-family:${F.disp};font-size:15px;letter-spacing:.05em;cursor:pointer">⬇ EXPORT</button>
        <button data-act="import" style="flex:1;padding:11px;border-radius:9px;border:1px solid ${C.border};background:transparent;color:${C.text};font-family:${F.disp};font-size:15px;letter-spacing:.05em;cursor:pointer">⬆ IMPORT</button>
      </div>
    </div>
    </div>`;
}

function modal(inner){
  const old=document.getElementById("modal"); if(old) old.remove();
  const w=document.createElement("div"); w.id="modal";
  w.style.cssText="position:fixed;inset:0;z-index:120;background:rgba(18,16,16,.86);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:ovin .2s ease";
  const c=document.createElement("div");
  c.style.cssText=`width:340px;max-width:100%;background:linear-gradient(180deg,#241f1d,#1b1716);border:1px solid ${C.border};border-radius:18px;padding:18px`;
  c.innerHTML=inner; w.appendChild(c);
  w.addEventListener("click",ev=>{ if(ev.target===w||(ev.target.hasAttribute&&ev.target.hasAttribute("data-close"))){ w.remove(); } });
  document.body.appendChild(w); return w;
}
function showExport(){
  const json=JSON.stringify(DATA);
  modal(`<div style="font-family:${F.disp};font-size:22px;color:${C.text};letter-spacing:.03em;margin-bottom:4px">BACKUP YOUR LOGS</div>
    <div style="font-size:11.5px;color:${C.muted};line-height:1.5;margin-bottom:10px">Copy this and paste it somewhere safe (Notes, email to yourself), or download the file. Keep it to restore later.</div>
    <textarea id="expbox" readonly style="width:100%;height:120px;background:${C.bg};border:1px solid ${C.border};border-radius:9px;padding:9px;color:${C.text};font-family:${F.mono};font-size:10px;resize:none;outline:none;box-sizing:border-box">${e(json)}</textarea>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button data-act="docopy" style="flex:1;padding:11px;border-radius:9px;border:none;background:${C.lime};color:#140f0d;font-family:${F.disp};font-size:15px;letter-spacing:.05em;cursor:pointer">COPY</button>
      <button data-act="dodownload" style="flex:1;padding:11px;border-radius:9px;border:1px solid ${C.blue};background:transparent;color:${C.blue};font-family:${F.disp};font-size:15px;letter-spacing:.05em;cursor:pointer">DOWNLOAD</button>
    </div>
    <button data-close style="width:100%;margin-top:8px;padding:9px;border-radius:9px;border:1px solid ${C.border};background:transparent;color:${C.muted};font-family:${F.mono};font-size:11px;cursor:pointer">Close</button>`);
}
function showImport(){
  modal(`<div style="font-family:${F.disp};font-size:22px;color:${C.text};letter-spacing:.03em;margin-bottom:4px">RESTORE LOGS</div>
    <div style="font-size:11.5px;color:${C.muted};line-height:1.5;margin-bottom:10px">Paste a backup below and tap Restore. It merges into this device — existing entries with the same day are overwritten, everything else is kept.</div>
    <textarea id="impbox" placeholder="Paste your backup text here…" style="width:100%;height:120px;background:${C.bg};border:1px solid ${C.border};border-radius:9px;padding:9px;color:${C.text};font-family:${F.mono};font-size:10px;resize:none;outline:none;box-sizing:border-box"></textarea>
    <div id="impmsg" style="font-family:${F.mono};font-size:10px;color:${C.orange};margin-top:6px;min-height:12px"></div>
    <button data-act="dorestore" style="width:100%;margin-top:6px;padding:11px;border-radius:9px;border:none;background:${C.green};color:#140f0d;font-family:${F.disp};font-size:15px;letter-spacing:.05em;cursor:pointer">RESTORE</button>
    <button data-close style="width:100%;margin-top:8px;padding:9px;border-radius:9px;border:1px solid ${C.border};background:transparent;color:${C.muted};font-family:${F.mono};font-size:11px;cursor:pointer">Close</button>`);
}

// ── Shell + render ──
function render(){
  const TABS=[["train","Train","🏋️"],["fuel","Fuel","🍽️"],["body","Body","📊"],["progress","Progress","📈"]];
  let inner=S.view==="train"?train():S.view==="fuel"?fuel():S.view==="body"?body():progress();
  let tabbar=`<div style="position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:rgba(27,23,22,.96);border-top:1px solid ${C.border};display:flex;padding:8px 8px calc(env(safe-area-inset-bottom) + 10px)">`;
  TABS.forEach(([id,l,ic])=>{ const on=S.view===id;
    tabbar+=`<div data-act="tab" data-v="${id}" style="flex:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:${on?C.lime:C.muted}"><span style="font-size:18px;opacity:${on?1:.6}">${ic}</span><span style="font-family:${F.mono};font-size:9px;letter-spacing:.05em">${l}</span></div>`; });
  tabbar+=`</div>`;
  document.getElementById("root").innerHTML=
    `<div style="max-width:480px;margin:0 auto;min-height:100vh;background:${C.bg};color:${C.text}">
      <div style="padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;border-bottom:1px solid ${C.border};position:sticky;top:0;background:rgba(18,16,16,.94);backdrop-filter:blur(10px);z-index:10">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <div style="font-family:${F.disp};font-size:26px;letter-spacing:.04em">DEADLY <span style="color:${C.red}">SPRINT</span></div>
          <div style="font-family:${F.mono};font-size:11px;color:${C.lime}">🏁 ${dtr()}d</div></div>
        <div style="font-family:${F.mono};font-size:9.5px;color:${C.muted};letter-spacing:.06em">SOLO · 12×200m + 12 LABOURS · 28 NOV 2026</div>
      </div>
      <div style="padding:16px 16px calc(env(safe-area-inset-bottom) + 96px)">${inner}</div>
      ${tabbar}
    </div>`;
}

// ── Celebration ──
function weekComplete(w){ return getDays(w).every((d,i)=> d.rest || (DATA[`w${w}d${i}`]||{}).completed ); }
function totalDone(){ let n=0; for(let w=1;w<=NWEEKS;w++){ getDays(w).forEach((d,i)=>{ if((DATA[`w${w}d${i}`]||{}).completed) n++; }); } return n; }
function tierFor(week,day){
  const days=getDays(week), wc=weekComplete(week);
  const count=`Session ${totalDone()} of ${TOTAL} · 🏁 ${dtr()}d to race`;
  let t;
  if(week===4 && day===5)          t={title:"DEADLY DONE",emoji:"🏆",sub:"12 runs · 12 labours · log your time",accent:C.red,confetti:150,big:true};
  else if(week===2 && wc)           t={title:"BUILD COMPLETE",emoji:"💪",sub:"Overload block banked",accent:C.purple,confetti:95,big:true};
  else if(week===3 && day===2)      t={title:"REHEARSAL DONE",emoji:"🎯",sub:"Full 12 rounds — log your time",accent:C.blue,confetti:85,big:true};
  else if(wc)                       t={title:"WEEK "+week+" DONE",emoji:"🔥",sub:PHASES[phOf(week)-1].title,accent:C.lime,confetti:65};
  else { const d=days[day];         t={title:"SESSION DONE",emoji:"🎉",sub:"Week "+week+" · "+d.num+" · "+d.name,accent:C.lime,confetti:38}; }
  t.count=count; return t;
}
function fireConfetti(box,n){
  const cols=[C.lime,C.blue,C.purple,C.orange,C.green,"#241f1d"];
  for(let i=0;i<n;i++){
    const p=document.createElement("span");
    const x=Math.random()*100,dur=1.8+Math.random()*1.7,delay=Math.random()*0.5;
    const w=6+Math.random()*6,h=9+Math.random()*10,rot=((Math.random()*720-360)|0)+"deg";
    p.style.cssText=`position:absolute;left:${x}%;top:-24px;width:${w}px;height:${h}px;background:${cols[i%cols.length]};border-radius:${i%4===0?"50%":"1px"};opacity:.9;animation:conffall ${dur}s linear ${delay}s forwards`;
    p.style.setProperty("--rot",rot);
    box.appendChild(p);
  }
}
function celebrate(t){
  const old=document.getElementById("celebrate"); if(old) old.remove();
  const wrap=document.createElement("div"); wrap.id="celebrate";
  wrap.style.cssText="position:fixed;inset:0;z-index:100;background:rgba(18,16,16,.86);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;animation:ovin .25s ease";
  const conf=document.createElement("div"); conf.style.cssText="position:absolute;inset:0;pointer-events:none"; wrap.appendChild(conf);
  const card=document.createElement("div");
  card.style.cssText=`position:relative;width:320px;max-width:100%;background:linear-gradient(180deg,#241f1d,#1b1716);border:1px solid ${t.accent}66;border-radius:22px;padding:26px 22px 22px;text-align:center;box-shadow:0 0 60px ${t.accent}22`;
  card.innerHTML=`<div style="width:74px;height:74px;border-radius:50%;background:${t.accent};display:flex;align-items:center;justify-content:center;margin:0 auto 4px;box-shadow:0 0 30px ${t.accent}88;animation:pop .45s ease"><span style="font-size:40px;color:#140f0d;font-weight:800;line-height:1">✓</span></div>
    <div style="font-size:26px;margin:6px 0 2px">${t.emoji}</div>
    <div style="font-family:${F.disp};font-size:${t.big?38:34}px;letter-spacing:.04em;color:${C.text};line-height:1.02">${t.title}</div>
    <div style="font-family:${F.mono};font-size:10px;color:${t.accent};letter-spacing:.1em;text-transform:uppercase;margin-top:7px">${t.sub}</div>
    <div style="font-family:${F.mono};font-size:11px;color:${C.muted};margin-top:5px">${t.count}</div>
    <button data-close="1" style="margin-top:18px;width:100%;padding:13px;border-radius:11px;border:none;background:${t.accent};color:#140f0d;font-family:${F.disp};font-size:17px;letter-spacing:.06em;cursor:pointer">KEEP GOING →</button>`;
  wrap.appendChild(card);
  wrap.addEventListener("click",ev=>{ if(ev.target===wrap||ev.target.getAttribute("data-close")){ wrap.style.animation="ovout .2s ease forwards"; setTimeout(()=>wrap.remove(),190); } });
  document.body.appendChild(wrap);
  fireConfetti(conf,t.confetti);
}

// ── Events ──
document.addEventListener("click",ev=>{
  if(ev.target && ev.target.matches && ev.target.matches("input,textarea")) return;
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const a=t.getAttribute("data-act"),v=t.getAttribute("data-v"),dk=`w${S.week}d${S.day}`;
  if(a==="tab"){S.view=v;render();}
  else if(a==="fuel"){S.fuel=v;render();}
  else if(a==="week"){S.week=+v;S.day=0;render();}
  else if(a==="phase"){S.week=+Object.keys(PHASES[+v-1].weeks)[0];S.day=0;render();}
  else if(a==="env"){const d=DATA[dk]||{};DATA[dk]={...d,env:v};persist();render();}
  else if(a==="skip"){ const d=DATA[dk]||{}; DATA[dk]={...d,skipped:true}; persist(); const nx=nextAfter(S.week,S.day); if(nx){S.week=nx.w;S.day=nx.i;} render(); window.scrollTo(0,0); }
  else if(a==="unskip"){ const d=DATA[dk]||{}; DATA[dk]={...d,skipped:false}; persist(); render(); }
  else if(a==="export"){showExport();}
  else if(a==="import"){showImport();}
  else if(a==="docopy"){
    const box=document.getElementById("expbox"); if(!box) return; box.select();
    const done=()=>{t.textContent="✓ COPIED";setTimeout(()=>{t.textContent="COPY";},1500);};
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(box.value).then(done).catch(()=>{try{document.execCommand("copy");done();}catch(_){}}); }
    else { try{document.execCommand("copy");done();}catch(_){} }
  }
  else if(a==="dodownload"){
    try{ const blob=new Blob([JSON.stringify(DATA)],{type:"application/json"});
      const url=URL.createObjectURL(blob); const el=document.createElement("a");
      el.href=url; el.download="deadly-sprint-backup-"+new Date().toISOString().slice(0,10)+".json";
      document.body.appendChild(el); el.click(); el.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
      t.textContent="✓ SAVED"; setTimeout(()=>{t.textContent="DOWNLOAD";},1500);
    }catch(_){ t.textContent="USE COPY"; }
  }
  else if(a==="dorestore"){
    const box=document.getElementById("impbox"),msg=document.getElementById("impmsg");
    if(!box) return; let obj;
    try{ obj=JSON.parse(box.value); }catch(_){ if(msg)msg.textContent="Couldn't read that — check you pasted the whole backup."; return; }
    if(!obj||typeof obj!=="object"||Array.isArray(obj)){ if(msg)msg.textContent="That doesn't look like a valid backup."; return; }
    Object.keys(obj).forEach(k=>{ DATA[k]=obj[k]; }); persist();
    const m=document.getElementById("modal"); if(m) m.remove(); render();
  }
  else if(a==="day"){S.day=+v;render();}
  else if(a==="jump"){S.week=+t.getAttribute("data-w");S.day=+t.getAttribute("data-d");S.view="train";render();}
  else if(a==="ex"){ if(ev.target.closest("[data-noex]")) return; const id=t.getAttribute("data-id");const d=DATA[dk]||{};const done={...(d.done||{})};done[id]=!done[id];DATA[dk]={...d,done};persist();render(); }
  else if(a==="round"){ const si=+t.getAttribute("data-si"),ri=+t.getAttribute("data-ri");const d=DATA[dk]||{};const fins={...(d.fins||{})};const arr=[...(fins[si]||[])];arr[ri]=!arr[ri];fins[si]=arr;DATA[dk]={...d,fins};persist();render(); }
  else if(a==="complete"){ const d=DATA[dk]||{};const now=!d.completed;DATA[dk]={...d,completed:now,skipped:false,completedAt:now?new Date().toISOString():null};persist();
    if(now){ const tier=tierFor(S.week,S.day); const nx=nextAfter(S.week,S.day); if(nx){S.week=nx.w;S.day=nx.i;} render(); celebrate(tier); }
    else { render(); } }
  else if(a==="bodysave"){
    const root=document.getElementById("root");const g=k=>{const el=root.querySelector(`[data-bf="${k}"]`);return el?el.value:"";};
    if(!g("weight")) return;
    const saved=DATA.__body||JSON.parse(JSON.stringify(BODY_SEED));
    const en={date:g("date"),weight:g("weight"),smm:g("smm"),pbf:g("pbf"),bmr:g("bmr"),vfa:g("vfa"),score:g("score")};
    const entries=[...(saved.entries||[]),en].sort((x,y)=>x.date.localeCompare(y.date));
    DATA.__body={...saved,entries};persist();render();
  }
});
// inputs (no re-render, keep focus)
document.addEventListener("input",ev=>{
  const t=ev.target; if(!t.getAttribute) return;
  if(t.getAttribute("data-field")==="note"){
    const dk=t.getAttribute("data-dk");const d=DATA[dk]||{};DATA[dk]={...d,note:t.value};persist();
  } else if(t.hasAttribute("data-w")){
    const dk=t.getAttribute("data-dk"),id=t.getAttribute("data-w"),key=t.getAttribute("data-wkey"),si=+t.getAttribute("data-set"),val=t.value;
    const d=DATA[dk]||{};const w={...(d.w||{})};
    let arr=Array.isArray(w[id])?w[id].slice():(w[id]!=null?[w[id]]:[]);
    arr[si]=val; w[id]=arr; DATA[dk]={...d,w};
    DATA.weights=DATA.weights||{}; DATA.weights[key]=arr.slice();
    persist();
    t.style.borderColor = val ? C.purple : C.border;
  }
});

{ const f=firstIncomplete(); if(f){ S.week=f.w; S.day=f.i; } }
render();

}catch(e){var d=document.getElementById("err");if(d){d.style.display="block";d.textContent="Error:\n"+(e&&e.stack?e.stack:e);}}
</script>
